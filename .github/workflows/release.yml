name: Release

# Publishing is driven by GitHub Releases: cutting a Release (tag vX.Y.Z) is
# what kicks off the npm publish. Pushing to main never publishes.
# See RELEASING.md.

on:
  release:
    types: [published]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - run: npm ci

      - name: Verify package.json version matches the release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: ./scripts/verify-version.sh "$RELEASE_TAG"

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: ./scripts/publish.sh
